        placeholder="arquivo.html  ou  https://..."

      </div>
    </section>

</div>

<script>
(() => {
  const ORB_PRESETS = {
    orb:   { name:'Orb',   icon:'◉', mode:'orb',            injectTarget:'symbol-bar',   panelWidth:'560px', frameWidth:'420px', frameHeight:'70vh' },
    frame: { name:'Frame', icon:'⟁', mode:'special-frame', injectTarget:'special-frame', panelWidth:'680px', frameWidth:'86vw',  frameHeight:'78vh' },
    dock:  { name:'Dock',  icon:'⌘', mode:'dock',           injectTarget:'symbol-bar',   panelWidth:'620px', frameWidth:'480px', frameHeight:'62vh' }
  };

  const state = { currentButton: null, longPressTimer: null };
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  function dispatch(name, detail = {}) {
    window.dispatchEvent(new CustomEvent(name, { detail }));
  }

  function getButtonKey(btn) {
    if (!btn) return null;
    return btn.id || btn.dataset.storeKey || null;
  }

  function updatePreview(text) {
    const el = $('#kblx-preview');
    if (el) el.textContent = text?.trim() ? `Destino: ${text}` : 'Nenhuma rota definida.';
  }

  function openPanel(btn) {
    if (!btn) return;
    state.currentButton = btn;

    const back = $('#kblx-back');
    const panel = $('#kblx-panel');
    const title = $('#kblx-ttl');
    const input = $('#kblx-inp');

    back?.classList.add('is-open');
    back?.setAttribute('aria-hidden', 'false');

    if (panel && btn.dataset.panelWidth) panel.style.width = btn.dataset.panelWidth;
    if (title) title.textContent = btn.dataset.title || btn.id || 'Botão';
    if (input) input.value = btn.dataset.url || '';
    updatePreview(btn.dataset.url || '');

    dispatch('nagatanazare:panel-open', { button: btn, url: btn.dataset.url || '', preset: btn.dataset.preset || '' });
  }

  function closePanel() {
    const back = $('#kblx-back');
    back?.classList.remove('is-open');
    back?.setAttribute('aria-hidden', 'true');
    dispatch('nagatanazare:panel-close', { button: state.currentButton });
    state.currentButton = null;
  }

  function paintButton(btn, iconText = '◉') {
    if (!btn) return;
    let icon = btn.querySelector('.symbol-icon');
    if (!icon) {
      icon = document.createElement('span');
      icon.className = 'symbol-icon';
      btn.prepend(icon);
    }
    icon.textContent = iconText;
    btn.dataset.diIconDone = '1';
  }

  function applyPreset(btn, presetKey) {
    const preset = ORB_PRESETS[presetKey];
    if (!btn || !preset) return;

    btn.dataset.preset = presetKey;
    btn.dataset.mode = preset.mode;
    btn.dataset.injectTarget = preset.injectTarget;
    btn.dataset.panelWidth = preset.panelWidth;
    btn.dataset.frameWidth = preset.frameWidth;
    btn.dataset.frameHeight = preset.frameHeight;

    paintButton(btn, preset.icon);

    const key = getButtonKey(btn);
    if (key) {
      const payload = {
        url: btn.dataset.url || '',
        preset: presetKey,
        mode: preset.mode,
        injectTarget: preset.injectTarget,
        panelWidth: preset.panelWidth,
        frameWidth: preset.frameWidth,
        frameHeight: preset.frameHeight,
        updatedAt: Date.now()
      };
      try { localStorage.setItem(`symbol_button_${key}`, JSON.stringify(payload)); } catch {}
      try { sessionStorage.setItem(`symbol_button_${key}`, JSON.stringify(payload)); } catch {}
    }

    dispatch('nagatanazare:preset-applied', { button: btn, preset, payload: { preset: presetKey } });
  }

  function saveUrl(btn, url) {
    if (!btn) return;
    const clean = String(url || '').trim();

    btn.dataset.url = clean;
    paintButton(btn, clean ? '⇱' : '◉');

    const key = getButtonKey(btn);
    if (key) {
      const payload = {
        url: clean,
        preset: btn.dataset.preset || '',
        mode: btn.dataset.mode || '',
        injectTarget: btn.dataset.injectTarget || '',
        panelWidth: btn.dataset.panelWidth || '',
        frameWidth: btn.dataset.frameWidth || '',
        frameHeight: btn.dataset.frameHeight || '',
        updatedAt: Date.now()
      };
      try { localStorage.setItem(`symbol_button_${key}`, JSON.stringify(payload)); } catch {}
      try { sessionStorage.setItem(`symbol_button_${key}`, JSON.stringify(payload)); } catch {}
    }

    dispatch('nagatanazare:button-updated', { button: btn, payload: { url: clean } });
  }

  function duplicateButton(btn) {
    if (!btn) return null;
    const clone = btn.cloneNode(true);
    clone.id = `${getButtonKey(btn) || 'orb'}-${Date.now().toString(36)}`;
    clone.dataset.storeKey = clone.id;
    btn.parentElement?.insertBefore(clone, btn.nextSibling);
    paintButton(clone, btn.querySelector('.symbol-icon')?.textContent || '◉');
    dispatch('nagatanazare:button-duplicated', { from: btn, to: clone });
    return clone;
  }

  function removeButton(btn) {
    if (!btn) return false;
    dispatch('nagatanazare:button-removed', { button: btn });
    btn.remove();
    return true;
  }

  function openSpecialFrame(payload = {}) {
    dispatch('kblx:special-frame-open', {
      url: String(payload.url || '').trim(),
      preset: payload.preset || 'frame',
      target: payload.target || 'special-frame',
      width: payload.width || '86vw',
      height: payload.height || '78vh',
      title: payload.title || '',
      meta: payload.meta || {},
      button: payload.button || null
    });
  }

  document.addEventListener('touchstart', (e) => {
    const btn = e.target.closest('.symbol-button[data-url]');
    if (!btn) return;
    clearTimeout(state.longPressTimer);
    state.longPressTimer = setTimeout(() => openPanel(btn), 550);
  }, { passive: true });

  document.addEventListener('touchend', () => clearTimeout(state.longPressTimer), { passive: true });
  document.addEventListener('touchmove', () => clearTimeout(state.longPressTimer), { passive: true });

  document.addEventListener('mousedown', (e) => {
    const btn = e.target.closest('.symbol-button[data-url]');
    if (!btn) return;
    clearTimeout(state.longPressTimer);
    state.longPressTimer = setTimeout(() => openPanel(btn), 550);
  });

  document.addEventListener('mouseup', () => clearTimeout(state.longPressTimer));
  document.addEventListener('mouseleave', () => clearTimeout(state.longPressTimer));

  document.addEventListener('contextmenu', (e) => {
    const btn = e.target.closest('.symbol-button[data-url]');
    if (!btn) return;
    e.preventDefault();
    openPanel(btn);
  });

  document.addEventListener('click', async (e) => {
    const closeBtn = e.target.closest('#kblx-btn-close');
    const saveBtn = e.target.closest('#kblx-btn-save');
    const clearBtn = e.target.closest('#kblx-btn-clear');
    const injectBtn = e.target.closest('#kblx-btn-orb-inject');
    const dupBtn = e.target.closest('#kblx-btn-dup');
    const delBtn = e.target.closest('#kblx-btn-del');
    const presetBtn = e.target.closest('[data-orb-preset]');
    const back = e.target.closest('#kblx-back');

    if (back && e.target === back) return closePanel();
    if (closeBtn) return closePanel();

    const current = state.currentButton;
    if (!current) return;

    if (presetBtn) {
      applyPreset(current, presetBtn.dataset.orbPreset);
      const title = $('#kblx-ttl');
      if (title) title.textContent = `${current.dataset.title || current.id || 'Botão'} · ${ORB_PRESETS[presetBtn.dataset.orbPreset].name}`;
      return;
    }

    if (saveBtn) {
      const input = $('#kblx-inp');
      saveUrl(current, input?.value || '');
      updatePreview(input?.value || '');
      return;
    }

    if (clearBtn) {
      current.dataset.url = '';
      current.dataset.preset = '';
      current.dataset.mode = '';
      current.dataset.injectTarget = '';
      current.dataset.panelWidth = '';
      current.dataset.frameWidth = '';
      current.dataset.frameHeight = '';
      paintButton(current, '◉');
      const input = $('#kblx-inp');
      if (input) input.value = '';
      updatePreview('');
      return;
    }

    if (injectBtn) {
      const preset = ORB_PRESETS[current.dataset.preset || 'frame'] || ORB_PRESETS.frame;
      openSpecialFrame({
        url: current.dataset.url || '',
        preset: current.dataset.preset || 'frame',
        target: current.dataset.injectTarget || preset.injectTarget,
        width: current.dataset.frameWidth || preset.frameWidth,
        height: current.dataset.frameHeight || preset.frameHeight,
        title: current.dataset.title || current.id || 'Botão',
        meta: { mode: current.dataset.mode || preset.mode },
        button: current
      });
      return;
    }

    if (dupBtn) {
      const clone = duplicateButton(current);
      if (clone) openPanel(clone);
      return;
    }

    if (delBtn) {
      if (removeButton(current)) closePanel();
      return;
    }
  });

  document.addEventListener('input', (e) => {
    if (!e.target.matches('#kblx-inp')) return;
    if (!state.currentButton) return;
    updatePreview(e.target.value);
    saveUrl(state.currentButton, e.target.value);
  });

  window.NAGATANAZARE = {
    presets: ORB_PRESETS,
    openPanel,
    closePanel,
    applyPreset,
    openSpecialFrame
  };

  window.KBLX_PANEL = { open: openPanel, close: closePanel };
  window.ORB_INJECT = { inject: openSpecialFrame, applyPreset };
  window.SPECIAL_FRAME = { open: openSpecialFrame };

  dispatch('nagatanazare:ready', { engine: 'NAGATANAZARE' });
})();
</script>
