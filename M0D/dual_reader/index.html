  <style>
    /* ========================================================
      CAMADA 1: VIEWPORT ROOT & FALLBACKS (Atlas / Z-Index) 
      ========================================================
    */
    :root {
      /* Atlas Mode Fallbacks */
      --atlas-base: 0;
      --atlas-content: 100;
      --atlas-widget: 600;
      --atlas-system: 1000;

      /* Universal Z-System */
      --z-base: var(--atlas-base);
      --z-content: var(--atlas-content);
      --z-widget: var(--atlas-widget);
      --z-system: var(--atlas-system);
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    html {
      width: 100%;
      height: 100%;
      min-width: 100vw;
      min-height: 100vh;
      overflow: hidden !important;
      overscroll-behavior: none !important;
      -webkit-overflow-scrolling: touch;
      -webkit-overscroll-behavior: none;
    }

    body {
      width: 100%;
      height: 100%;
      padding: 1px; /* Depth lock mechanic */
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      background: #010708; /* Fallback da interface original */
    }

    /* ========================================================
      CAMADA 2: FREEZE MECHANICS & LAYERS
      ========================================================
    */
    .layer-container {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none; /* Deixa o clique vazar onde for vazio */
    }
    .layer-container > * {
      pointer-events: auto; /* Reativa cliques nos elementos filhos */
    }

    [data-layer="base"]    { z-index: var(--z-base);    --z-layer-val: var(--z-base); }
    [data-layer="content"] { z-index: var(--z-content); --z-layer-val: var(--z-content); }
    [data-layer="widget"]  { z-index: var(--z-widget);  --z-layer-val: var(--z-widget); }
    [data-layer="system"]  { z-index: var(--z-system);  --z-layer-val: var(--z-system); }

    /* ========================================================
      CAMADA 3: WARP (UNIVERSO INTERNO 3x3)
      ========================================================
    */
    #atlas-warp {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;   /* 3 × 100vw */
      height: 100vh;  /* 3 × 100vh */
      transform-origin: top left;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    /* ========================================================
      CAMADA 4: Z-MODE (ATLAS 3D PERSPECTIVE)
      ========================================================
    */
    #atlas-warp.z-mode {
      transform:
        perspective(1200px)
        rotateX(28deg)
        rotateY(-12deg)
        scale(0.55);
      transform-style: preserve-3d;
    }

    /* Expande visualmente os layers quando está em 3D */
    #atlas-warp.z-mode > [data-layer] {
      display: block !important;
      opacity: 0.9;
      outline: 1px solid rgba(0, 216, 216, 0.2); 
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      transform: translateZ(calc(var(--z-layer-val, 0) * 0.4px));
      cursor: grab;
      pointer-events: auto;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }
  </style>

      >> MIND POLE INTEGRATED. KODUX & ATLAS SYNCED.
    `);

    let pressTimer;
    const warpContainer = document.getElementById('atlas-warp');

    document.addEventListener('pointerdown', (e) => {
      // Evita interrupção caso clique diretamente em inputs ou botões na interface 2D
      if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;

      pressTimer = setTimeout(() => {
        warpContainer.classList.toggle('z-mode');
        const state = warpContainer.classList.contains('z-mode') ? "Acessando Z-Mode (Reality Zone)" : "Retornando à superfície 2D";
        console.log(`[ATLAS] ${state}`);
      }, 600); // Aciona após 600ms
    });

    document.addEventListener('pointerup', () => clearTimeout(pressTimer));
    document.addEventListener('pointerleave', () => clearTimeout(pressTimer));
    document.addEventListener('pointercancel', () => clearTimeout(pressTimer));
  </script>
